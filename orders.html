<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Заказы | Food Construct</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/orders.css">
</head>

<body>

	<header>
		<h1>Food Construct</h1>
		<nav>
			<a href="index.html">О нас</a>
			<a href="lunch.html">Собрать ланч</a>
			<a href="checkout.html">Оформить заказ</a>
			<a id="active" href="orders.html">Заказы</a>
			<a href="#footer">Контакты</a>
		</nav>
	</header>

	<main>
		<section>
			<h2>История заказов</h2>
			<p id="orders-empty" hidden>Заказов пока нет</p>
			<div id="table-wrapper">
				<table>
					<thead>
						<tr>
							<th>№</th>
							<th>Дата оформления</th>
							<th>Состав заказа</th>
							<th>Стоимость</th>
							<th>Время доставки</th>
							<th>Действия</th>
						</tr>
					</thead>
					<tbody id="orders-body"></tbody>
				</table>
			</div>
		</section>
	</main>

	<footer id="footer">
		<p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
		<p>Email: <a href="mailto:info@foodconstruct.ru">info@foodconstruct.ru</a></p>
	</footer>

	<dialog id="modal">
		<form id="modal-form"></form>
	</dialog>

	<div id="toast" popover="manual" role="status"></div>

	<script src="js/dishes.js"></script>
	<script src="js/orders.js"></script>
</body>

</html>
